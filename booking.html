    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
      body { font-family: 'Outfit', sans-serif; }
    </style>

  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="w-10 h-10 bg-primary text-white rounded-xl flex items-center justify-center font-black text-xl group-hover:rotate-12 transition-transform shadow-md">K</div>
          <span class="font-bold text-xl tracking-tight text-slate-800">Kurunji <span class="text-primary">Fun World</span></span>
        </a>
        <a href="index.html" class="text-sm font-bold text-slate-500 hover:text-primary transition-colors flex items-center gap-1">
          <span class="material-symbols-outlined text-lg">arrow_back</span> Back to Site
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
          <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-4 tracking-tight">Book Your Visit</h1>
          <p class="text-lg text-slate-500 font-medium">Select your date and packages for an unforgettable experience.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
          <!-- Step 1 -->
          <div class="p-8 border-b border-slate-100">
            <h2 class="text-xl font-bold flex items-center gap-3 mb-6"><span class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center text-sm">1</span> Select Date</h2>
            <input type="date" class="w-full md:w-1/2 rounded-xl border-slate-300 shadow-sm focus:border-primary focus:ring-primary" value="2026-09-01" />
          </div>
          
          <!-- Step 2 -->
          <div class="p-8 border-b border-slate-100 bg-slate-50/50">
            <h2 class="text-xl font-bold flex items-center gap-3 mb-6"><span class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center text-sm">2</span> Choose Packages</h2>
            <div class="grid md:grid-cols-2 gap-6">
              
              <label class="relative flex cursor-pointer rounded-2xl border-2 border-slate-200 bg-white p-6 hover:border-primary/50 transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/5 has-[:checked]:ring-1 has-[:checked]:ring-primary">
                <input type="checkbox" name="pkg" class="peer sr-only" checked />
                <div class="flex flex-col gap-2">
                  <div class="flex items-center justify-between">
                    <span class="font-bold text-lg">All-Access Pass</span>
                    <span class="font-black text-primary text-xl">?999</span>
                  </div>
                  <p class="text-sm text-slate-500 font-medium">Unlimited rides on Ground Floor + 1 VR Experience + 1 Hour Outdoor Access.</p>
                </div>
                <div class="absolute right-6 top-6 h-6 w-6 rounded-full border-2 border-slate-300 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
                  <span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
                </div>
              </label>

              <label class="relative flex cursor-pointer rounded-2xl border-2 border-slate-200 bg-white p-6 hover:border-primary/50 transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary/5 has-[:checked]:ring-1 has-[:checked]:ring-primary">
                <input type="checkbox" name="pkg" class="peer sr-only" />
                <div class="flex flex-col gap-2">
                  <div class="flex items-center justify-between">
                    <span class="font-bold text-lg">Kids Fun Pack</span>
                    <span class="font-black text-primary text-xl">?499</span>
                  </div>
                  <p class="text-sm text-slate-500 font-medium">Access to Ball Pool, Trampoline, and safe Ground Floor kiddie rides.</p>
                </div>
                <div class="absolute right-6 top-6 h-6 w-6 rounded-full border-2 border-slate-300 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
                  <span class="material-symbols-outlined text-white text-sm opacity-0 peer-checked:opacity-100">check</span>
                </div>
              </label>

            </div>
          </div>

          <!-- Step 3 -->
          <div class="p-8 border-b border-slate-100">
            <h2 class="text-xl font-bold flex items-center gap-3 mb-6"><span class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center text-sm">3</span> Guest Count</h2>
            <div class="flex items-center gap-6">
              <div class="flex flex-col">
                <span class="font-bold">Adults</span>
                <span class="text-xs text-slate-500">Age 13+</span>
              </div>
              <div class="flex items-center gap-4 bg-slate-100 p-2 rounded-xl border border-slate-200">
                <button class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center hover:text-primary">-</button>
                <span class="font-bold w-4 text-center">2</span>
                <button class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center hover:text-primary">+</button>
              </div>
            </div>
          </div>

          <!-- Checkout -->
          <div class="p-8 bg-slate-900 text-white flex flex-col md:flex-row items-center justify-between gap-6">
            <div>
              <div class="text-slate-400 text-sm font-semibold mb-1">Total Amount</div>
              <div class="text-4xl font-black">?1,998</div>
            </div>
            <button onclick="alert('This is a demo booking page! Payments are not active.')" class="bg-primary hover:bg-blue-500 text-white px-10 py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all hover:-translate-y-1 w-full md:w-auto">
              Pay Now
            </button>
          </div>
        </div>
        
        <div class="text-center mt-8">
          <p class="text-slate-500 text-sm font-medium">Demo Architecture for Public Online Booking (Phase 21)</p>
        </div>
      </div>
    </main>
  </body>
